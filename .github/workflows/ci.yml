name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Pytest & Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          JWT_SECRET_KEY: "nexus-ci-test-secret-key-at-least-32-chars-long"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Production Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Production Frontend (frontend/)
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Modern Dashboard (frontend-v2/)
        run: |
          cd frontend-v2
          npm install
          npm run build
